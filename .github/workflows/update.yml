name: Update Taiwan AI supply-chain index

on:
  schedule:
    - cron: '0 2 11 * *'
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all pages
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python build.py
          python scoreboard.py
          python news.py
          python readthrough.py
          python power.py
          python gw.py
      - name: Commit updated site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
